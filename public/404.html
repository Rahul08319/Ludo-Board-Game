<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ludo Board Game</title>
    <script>
      // Single Page App redirect for GitHub Pages
      // When GitHub Pages serves 404 for a deep link or subpath, redirect cleanly to hash route
      var path = window.location.pathname;
      var repo = '/Ludo-Board-Game';
      if (path.startsWith(repo)) {
        var subpath = path.slice(repo.length);
        if (subpath.startsWith('/')) subpath = subpath.slice(1);
        window.location.replace(repo + '/#/' + subpath + window.location.search);
      } else {
        window.location.replace(repo + '/#/');
      }
    </script>
  </head>
  <body style="margin: 0; background-color: #0f172a; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh;">
    <p>Loading Ludo Game...</p>
  </body>
</html>
